<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Resonance Engine Radial Sequencer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1ff9f9",
                        "secondary-magenta": "#f91fde",
                        "secondary-lime": "#bef91f",
                        "background-light": "#f5f8f8",
                        "background-dark": "#0f1315", // Deep, almost black
                        "surface-dark": "#161b1e",
                        "surface-raised": "#1f2529",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                    boxShadow: {
                        'glow-primary': '0 0 10px rgba(31, 249, 249, 0.5), 0 0 20px rgba(31, 249, 249, 0.3)',
                        'glow-magenta': '0 0 10px rgba(249, 31, 222, 0.5), 0 0 20px rgba(249, 31, 222, 0.3)',
                        'glow-lime': '0 0 10px rgba(190, 249, 31, 0.5), 0 0 20px rgba(190, 249, 31, 0.3)',
                        'neumorphic-pressed': 'inset 2px 2px 5px rgba(0,0,0,0.5), inset -2px -2px 5px rgba(255,255,255,0.05)',
                        'neumorphic-flat': '4px 4px 10px rgba(0,0,0,0.5), -1px -1px 3px rgba(255,255,255,0.05)',
                    },
                    backgroundImage: {
                        'grid-pattern': "linear-gradient(to right, #1f2529 1px, transparent 1px), linear-gradient(to bottom, #1f2529 1px, transparent 1px)",
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #0f1315;
            overflow-x: hidden;
        }
        
        /* Custom Grid Background */
        .bg-grid {
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }

        /* Radar Sweep Animation */
        @keyframes radarSweep {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .radar-line {
            transform-origin: center;
            animation: radarSweep 2s linear infinite;
        }

        /* Pulse Animation for BPM */
        @keyframes pulseBeat {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 15px currentColor; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .animate-pulse-beat {
            animation: pulseBeat 0.468s ease-in-out infinite; /* ~128 BPM */
        }

        /* Knob Rotation Indicator */
        .knob-indicator {
            transform-origin: bottom center;
        }

        /* Hide Scrollbar */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen text-slate-900 dark:text-slate-100 relative">
<!-- Background Grid -->
<div class="fixed inset-0 pointer-events-none opacity-20 z-0 bg-grid-pattern bg-grid"></div>
<!-- Main Container -->
<div class="relative z-10 flex flex-col h-screen max-w-md mx-auto overflow-hidden bg-background-light/50 dark:bg-background-dark/50 backdrop-blur-sm shadow-2xl border-x border-surface-raised">
<!-- Header -->
<header class="flex items-center justify-between px-6 py-4 border-b border-surface-raised bg-surface-dark/80 backdrop-blur-md sticky top-0 z-20">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary animate-pulse-beat" style="font-size: 28px;">graphic_eq</span>
<h1 class="text-lg font-bold tracking-wider text-slate-100">RESONANCE</h1>
</div>
<div class="flex flex-col items-center">
<div class="text-3xl font-bold text-primary animate-pulse-beat leading-none">128</div>
<div class="text-[10px] text-slate-400 font-medium tracking-widest uppercase mt-1">BPM</div>
</div>
<button class="p-2 rounded-full hover:bg-surface-raised transition-colors text-slate-400 hover:text-white">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<!-- Main Content Area: Scrollable -->
<main class="flex-1 flex flex-col overflow-y-auto no-scrollbar pb-24">
<!-- Radial Sequencer Section -->
<section class="relative flex-shrink-0 w-full aspect-square flex items-center justify-center p-4 my-2">
<!-- Center decorative element -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-24 h-24 rounded-full border border-surface-raised bg-surface-dark shadow-neumorphic-flat flex items-center justify-center z-10">
<span class="material-symbols-outlined text-slate-600 text-4xl">play_circle</span>
</div>
</div>
<!-- Radial SVG -->
<div class="relative w-full h-full max-w-[360px] max-h-[360px]">
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 400 400">
<!-- Defs for glows -->
<defs>
<filter height="200%" id="glow-cyan" width="200%" x="-50%" y="-50%">
<fegaussianblur result="coloredBlur" stddeviation="4"></fegaussianblur>
<femerge>
<femergenode in="coloredBlur"></femergenode>
<femergenode in="SourceGraphic"></femergenode>
</femerge>
</filter>
</defs>
<!-- Track 4: Synth (Outer) -->
<g class="track-synth cursor-pointer">
<circle cx="200" cy="200" fill="none" r="190" stroke="#1f2529" stroke-width="24"></circle>
<!-- Active Step Examples -->
<path class="opacity-80" d="M 200 10 A 190 190 0 0 1 272.7 24.5" fill="none" filter="url(#glow-cyan)" stroke="#f91fde" stroke-dasharray="0 20" stroke-linecap="round" stroke-width="18"></path>
<path class="opacity-30" d="M 200 10" fill="none" stroke="#333" stroke-dasharray="2 72.5" stroke-width="24"></path> <!-- Grid lines -->
</g>
<!-- Track 3: Hi-Hat -->
<g class="track-hat cursor-pointer">
<circle cx="200" cy="200" fill="none" r="155" stroke="#1f2529" stroke-width="24"></circle>
<path class="opacity-90" d="M 200 45 A 155 155 0 0 1 259.3 56.8" fill="none" filter="url(#glow-cyan)" stroke="#bef91f" stroke-linecap="round" stroke-width="18"></path>
<path class="opacity-60" d="M 355 200 A 155 155 0 0 1 346.8 259.3" fill="none" filter="url(#glow-cyan)" stroke="#bef91f" stroke-linecap="round" stroke-width="18"></path>
<path class="opacity-30" d="M 200 45" fill="none" stroke="#333" stroke-dasharray="2 59" stroke-width="24"></path>
</g>
<!-- Track 2: Snare -->
<g class="track-snare cursor-pointer">
<circle cx="200" cy="200" fill="none" r="120" stroke="#1f2529" stroke-width="24"></circle>
<path d="M 320 200 A 120 120 0 0 1 200 320" fill="none" filter="url(#glow-cyan)" stroke="#1ff9f9" stroke-dasharray="0 100" stroke-linecap="round" stroke-width="18"></path>
<path class="opacity-30" d="M 200 80" fill="none" stroke="#333" stroke-dasharray="2 45" stroke-width="24"></path>
</g>
<!-- Track 1: Kick (Inner) -->
<g class="track-kick cursor-pointer">
<circle cx="200" cy="200" fill="none" r="85" stroke="#1f2529" stroke-width="24"></circle>
<circle class="opacity-100" cx="200" cy="200" fill="none" filter="url(#glow-cyan)" r="85" stroke="#1ff9f9" stroke-dasharray="30 400" stroke-linecap="round" stroke-width="18"></circle>
<path class="opacity-30" d="M 200 115" fill="none" stroke="#333" stroke-dasharray="2 31" stroke-width="24"></path>
</g>
</svg>
<!-- Radar Playhead -->
<div class="absolute inset-0 pointer-events-none radar-line z-20">
<div class="w-full h-full relative">
<div class="absolute top-0 left-1/2 w-[2px] h-1/2 bg-gradient-to-b from-primary via-primary/50 to-transparent origin-bottom shadow-[0_0_10px_#1ff9f9]"></div>
</div>
</div>
</div>
</section>
<!-- Controls Deck -->
<section class="flex flex-col gap-6 px-6 mt-2">
<!-- Rotary Knobs Row -->
<div class="grid grid-cols-3 gap-4">
<!-- Knob 1: Pitch -->
<div class="flex flex-col items-center gap-2">
<div class="relative w-20 h-20 rounded-full bg-surface-dark shadow-neumorphic-flat flex items-center justify-center group cursor-pointer active:shadow-neumorphic-pressed transition-all duration-200">
<!-- Indicator -->
<div class="absolute w-full h-full rounded-full border-4 border-surface-raised opacity-50"></div>
<div class="absolute w-1 h-3 bg-primary rounded-full top-2 shadow-[0_0_8px_#1ff9f9]" style="transform: rotate(45deg); transform-origin: 50% 32px;"></div>
<!-- Inner cap -->
<div class="w-12 h-12 rounded-full bg-surface-raised shadow-[inset_1px_1px_3px_rgba(255,255,255,0.05),inset_-2px_-2px_5px_rgba(0,0,0,0.8)] flex items-center justify-center">
<span class="material-symbols-outlined text-primary/50 text-sm">tune</span>
</div>
</div>
<span class="text-xs font-bold text-slate-400 tracking-wider uppercase">Pitch</span>
</div>
<!-- Knob 2: Decay -->
<div class="flex flex-col items-center gap-2">
<div class="relative w-20 h-20 rounded-full bg-surface-dark shadow-neumorphic-flat flex items-center justify-center group cursor-pointer active:shadow-neumorphic-pressed transition-all duration-200">
<div class="absolute w-full h-full rounded-full border-4 border-surface-raised opacity-50"></div>
<div class="absolute w-1 h-3 bg-secondary-magenta rounded-full top-2 shadow-[0_0_8px_#f91fde]" style="transform: rotate(120deg); transform-origin: 50% 32px;"></div>
<div class="w-12 h-12 rounded-full bg-surface-raised shadow-[inset_1px_1px_3px_rgba(255,255,255,0.05),inset_-2px_-2px_5px_rgba(0,0,0,0.8)] flex items-center justify-center">
<span class="material-symbols-outlined text-secondary-magenta/50 text-sm">timelapse</span>
</div>
</div>
<span class="text-xs font-bold text-slate-400 tracking-wider uppercase">Decay</span>
</div>
<!-- Knob 3: Reverb -->
<div class="flex flex-col items-center gap-2">
<div class="relative w-20 h-20 rounded-full bg-surface-dark shadow-neumorphic-flat flex items-center justify-center group cursor-pointer active:shadow-neumorphic-pressed transition-all duration-200">
<div class="absolute w-full h-full rounded-full border-4 border-surface-raised opacity-50"></div>
<div class="absolute w-1 h-3 bg-secondary-lime rounded-full top-2 shadow-[0_0_8px_#bef91f]" style="transform: rotate(240deg); transform-origin: 50% 32px;"></div>
<div class="w-12 h-12 rounded-full bg-surface-raised shadow-[inset_1px_1px_3px_rgba(255,255,255,0.05),inset_-2px_-2px_5px_rgba(0,0,0,0.8)] flex items-center justify-center">
<span class="material-symbols-outlined text-secondary-lime/50 text-sm">blur_on</span>
</div>
</div>
<span class="text-xs font-bold text-slate-400 tracking-wider uppercase">Reverb</span>
</div>
</div>
<!-- Sliders Section -->
<div class="flex flex-col gap-5 bg-surface-dark/50 p-4 rounded-xl border border-surface-raised shadow-neumorphic-pressed">
<!-- Slider 1: Bit Crush -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center text-xs font-bold text-slate-400 tracking-wider uppercase">
<span>Bit Crush</span>
<span class="text-primary">45%</span>
</div>
<div class="relative h-8 w-full flex items-center">
<!-- Track -->
<div class="absolute inset-0 h-2 my-auto bg-surface-raised rounded-full shadow-inner overflow-hidden">
<div class="h-full bg-primary/20 w-1/2 rounded-full"></div>
</div>
<!-- Thumb -->
<div class="absolute left-1/2 w-8 h-4 bg-surface-dark border border-primary rounded shadow-[0_0_10px_rgba(31,249,249,0.3)] flex justify-center items-center cursor-ew-resize transform -translate-x-1/2">
<div class="w-[2px] h-2 bg-primary"></div>
</div>
</div>
</div>
<!-- Slider 2: Master Vol -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center text-xs font-bold text-slate-400 tracking-wider uppercase">
<span>Master Vol</span>
<span class="text-secondary-lime">80%</span>
</div>
<div class="relative h-8 w-full flex items-center">
<!-- Track -->
<div class="absolute inset-0 h-2 my-auto bg-surface-raised rounded-full shadow-inner overflow-hidden">
<div class="h-full bg-secondary-lime/20 w-[80%] rounded-full"></div>
</div>
<!-- Thumb -->
<div class="absolute left-[80%] w-8 h-4 bg-surface-dark border border-secondary-lime rounded shadow-[0_0_10px_rgba(190,249,31,0.3)] flex justify-center items-center cursor-ew-resize transform -translate-x-1/2">
<div class="w-[2px] h-2 bg-secondary-lime"></div>
</div>
</div>
</div>
</div>
</section>
</main>
<!-- Bottom Transport Dock -->
<footer class="absolute bottom-0 w-full px-6 py-4 bg-surface-dark/95 backdrop-blur-xl border-t border-surface-raised z-30">
<div class="flex items-center justify-between gap-4 max-w-sm mx-auto">
<!-- Stop Btn -->
<button class="flex-1 group h-14 rounded-lg bg-surface-raised shadow-neumorphic-flat active:shadow-neumorphic-pressed active:scale-95 transition-all flex flex-col items-center justify-center border border-transparent active:border-red-500/20">
<span class="material-symbols-outlined text-slate-400 group-active:text-red-500 transition-colors" style="font-variation-settings: 'FILL' 1;">stop</span>
<span class="text-[10px] font-bold text-slate-500 uppercase mt-1">Stop</span>
</button>
<!-- Play/Pause Btn (Primary) -->
<button class="flex-[1.5] group h-16 -mt-4 rounded-xl bg-surface-raised shadow-[0_0_20px_rgba(31,249,249,0.1),_4px_4px_10px_rgba(0,0,0,0.5)] active:shadow-[inset_2px_2px_5px_rgba(0,0,0,0.5)] active:scale-95 transition-all flex flex-col items-center justify-center border border-primary/20 hover:border-primary/50">
<span class="material-symbols-outlined text-primary group-hover:drop-shadow-[0_0_5px_#1ff9f9] transition-all" style="font-size: 36px; font-variation-settings: 'FILL' 1;">play_arrow</span>
<span class="text-[10px] font-bold text-primary uppercase mt-1">Play</span>
</button>
<!-- Clear Btn -->
<button class="flex-1 group h-14 rounded-lg bg-surface-raised shadow-neumorphic-flat active:shadow-neumorphic-pressed active:scale-95 transition-all flex flex-col items-center justify-center border border-transparent active:border-yellow-500/20">
<span class="material-symbols-outlined text-slate-400 group-active:text-yellow-500 transition-colors">delete_outline</span>
<span class="text-[10px] font-bold text-slate-500 uppercase mt-1">Clear</span>
</button>
</div>
</footer>
</div>
</body></html>

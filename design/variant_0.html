<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Resonance Engine: Glitch Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=VT323&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "glitch-black": "#000000",
                        "glitch-green": "#00ff00",
                        "glitch-red": "#ff0000",
                        "glitch-dark-gray": "#111111",
                        "glitch-mid-gray": "#222222",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "mono": ["VT323", "monospace"],
                    },
                    boxShadow: {
                        'neon-green': '0 0 5px #00ff00, 0 0 10px #00ff00',
                        'neon-red': '0 0 5px #ff0000, 0 0 10px #ff0000',
                        'hard-shadow': '4px 4px 0px #00ff00',
                        'hard-shadow-red': '4px 4px 0px #ff0000',
                    },
                    backgroundImage: {
                        'scanline': "linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06))",
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #000000;
            overflow-x: hidden;
        }.glitch-text {
            position: relative;
        }
        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }
        .glitch-text::before {
            left: 2px;
            text-shadow: -1px 0 #ff0000;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            left: -2px;
            text-shadow: -1px 0 #00ff00;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0% { clip: rect(13px, 9999px, 81px, 0); }
            20% { clip: rect(78px, 9999px, 14px, 0); }
            40% { clip: rect(19px, 9999px, 92px, 0); }
            60% { clip: rect(5px, 9999px, 32px, 0); }
            80% { clip: rect(66px, 9999px, 37px, 0); }
            100% { clip: rect(93px, 9999px, 13px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(65px, 9999px, 100px, 0); }
            20% { clip: rect(40px, 9999px, 7px, 0); }
            40% { clip: rect(89px, 9999px, 36px, 0); }
            60% { clip: rect(2px, 9999px, 66px, 0); }
            80% { clip: rect(26px, 9999px, 83px, 0); }
            100% { clip: rect(53px, 9999px, 12px, 0); }
        }@keyframes radarSweepStep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .radar-line-stepped {
            transform-origin: center;
            animation: radarSweepStep 4s steps(64) infinite;
        }.bg-scanline {
            background-size: 100% 4px, 6px 100%;
        }.stroke-segmented {
            stroke-dasharray: 4 4; 
        }::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-glitch-black text-glitch-green min-h-screen relative font-mono overflow-hidden">
<div class="fixed inset-0 pointer-events-none z-50 bg-scanline opacity-20"></div>
<div class="fixed inset-0 pointer-events-none z-0 bg-[radial-gradient(circle_at_80%_20%,_#111_0%,_#000_60%)]"></div>
<div class="relative z-10 flex flex-col h-screen max-w-md mx-auto bg-black border-x-2 border-glitch-dark-gray shadow-2xl">
<header class="flex items-start justify-between px-4 py-6 border-b-4 border-glitch-green bg-black z-20">
<div class="flex flex-col">
<h1 class="text-4xl font-bold tracking-tighter text-white glitch-text font-mono" data-text="RES_ENG">RES_ENG</h1>
<span class="text-xs text-glitch-red uppercase tracking-widest mt-1 bg-glitch-dark-gray inline-block px-1 w-max">:: GLITCH_CORE_V1</span>
</div>
<div class="flex flex-col items-end border-l-2 border-glitch-dark-gray pl-3">
<div class="text-3xl font-bold text-glitch-green leading-none">128</div>
<div class="text-[10px] text-glitch-dark-gray bg-glitch-green px-1 font-bold mt-1">BPM</div>
</div>
</header>
<main class="flex-1 relative overflow-hidden">
<div class="absolute top-0 right-0 w-2/3 h-2/3 border-b border-l border-glitch-dark-gray opacity-50 pointer-events-none"></div>
<div class="absolute bottom-10 left-10 w-20 h-20 border border-glitch-red opacity-30 pointer-events-none"></div>
<section class="absolute -right-16 -top-10 w-[450px] h-[450px] flex items-center justify-center pointer-events-none">
<div class="relative w-full h-full pointer-events-auto scale-90 origin-top-right">
<svg class="w-full h-full transform -rotate-90" viewBox="0 0 400 400">
<defs>
<filter id="pixelate" x="0" y="0">
<feFlood height="2" width="2" x="2" y="2"></feFlood>
<feComposite height="4" width="4"></feComposite>
<feTile result="a"></feTile>
<feComposite in="SourceGraphic" in2="a" operator="in"></feComposite>
<feMorphology operator="dilate" radius="1"></feMorphology>
</filter>
<filter id="glow-green">
<feGaussianBlur result="coloredBlur" stdDeviation="2.5"></feGaussianBlur>
<feMerge>
<feMergeNode in="coloredBlur"></feMergeNode>
<feMergeNode in="SourceGraphic"></feMergeNode>
</feMerge>
</filter>
</defs>
<g class="track-synth cursor-pointer">
<circle cx="200" cy="200" fill="none" r="190" stroke="#111" stroke-dasharray="10 2" stroke-width="20"></circle>
<path class="opacity-100" d="M 200 10 A 190 190 0 0 1 272.7 24.5" fill="none" filter="url(#glow-green)" stroke="#00ff00" stroke-dasharray="10 2" stroke-width="20"></path>
<path class="opacity-60" d="M 275 25 A 190 190 0 0 1 290 35" fill="none" stroke="#ff0000" stroke-width="4"></path>
</g>
<g class="track-hat cursor-pointer">
<circle cx="200" cy="200" fill="none" r="155" stroke="#111" stroke-dasharray="2 4" stroke-width="12"></circle>
<path class="opacity-100" d="M 200 45 A 155 155 0 0 1 259.3 56.8" fill="none" stroke="#ff0000" stroke-linecap="square" stroke-width="12"></path>
<path class="opacity-80" d="M 355 200 A 155 155 0 0 1 346.8 259.3" fill="none" stroke="#ff0000" stroke-linecap="square" stroke-width="12"></path>
</g>
<g class="track-snare cursor-pointer">
<circle cx="200" cy="200" fill="none" r="120" stroke="#111" stroke-dasharray="20 5" stroke-width="16"></circle>
<path d="M 320 200 A 120 120 0 0 1 200 320" fill="none" filter="url(#glow-green)" stroke="#00ff00" stroke-dasharray="20 5" stroke-width="16"></path>
</g>
<g class="track-kick cursor-pointer">
<circle cx="200" cy="200" fill="none" r="85" stroke="#111" stroke-width="24"></circle>
<circle class="opacity-100" cx="200" cy="200" fill="none" r="85" stroke="#fff" stroke-dasharray="40 400" stroke-width="24"></circle>
</g>
<circle cx="200" cy="200" fill="#000" r="40" stroke="#333" stroke-width="2"></circle>
<text class="animate-pulse" fill="#00ff00" font-family="VT323" font-size="24" text-anchor="middle" x="200" y="205">PLAY</text>
</svg>
<div class="absolute inset-0 pointer-events-none radar-line-stepped z-20">
<div class="w-full h-full relative">
<div class="absolute top-0 left-1/2 w-[6px] h-[55%] bg-glitch-green origin-bottom shadow-neon-green"></div>
<div class="absolute top-4 left-[calc(50%-4px)] w-[2px] h-[40%] bg-glitch-red opacity-50 origin-bottom"></div>
<div class="absolute top-8 left-[calc(50%-8px)] w-[2px] h-[30%] bg-white opacity-30 origin-bottom"></div>
</div>
</div>
</div>
</section>
<section class="absolute top-32 left-4 w-1/2 flex flex-col gap-8 z-30">
<div class="bg-black border-2 border-white p-2 shadow-hard-shadow-red relative group">
<div class="absolute -top-1 -left-1 w-2 h-2 bg-glitch-red"></div>
<div class="absolute -bottom-1 -right-1 w-2 h-2 bg-glitch-red"></div>
<div class="flex items-center justify-between mb-2 border-b border-glitch-dark-gray pb-1">
<span class="text-xs font-bold text-white uppercase font-mono">PITCH_MOD</span>
<div class="w-2 h-2 bg-glitch-green animate-pulse"></div>
</div>
<div class="flex items-center gap-3">
<div class="relative w-12 h-12 bg-glitch-dark-gray border border-glitch-green flex items-center justify-center cursor-pointer hover:bg-glitch-mid-gray transition-colors">
<div class="w-[2px] h-full bg-glitch-green transform rotate-45"></div>
<div class="h-[2px] w-full bg-glitch-green transform rotate-45"></div>
</div>
<div class="flex flex-col">
<span class="text-xl font-mono text-glitch-green">440</span>
<span class="text-[10px] text-gray-500 uppercase">Hz</span>
</div>
</div>
</div>
<div class="bg-black border-2 border-glitch-dark-gray p-2 hover:border-glitch-green transition-colors relative">
<div class="flex items-center justify-between mb-2">
<span class="text-xs font-bold text-gray-400 uppercase font-mono">DECAY</span>
</div>
<div class="relative w-full h-8 bg-glitch-dark-gray">
<div class="absolute top-0 left-0 h-full w-[70%] bg-repeating-linear-gradient(90deg, #00ff00, #00ff00 2px, transparent 2px, transparent 4px)"></div>
<div class="absolute top-0 left-[70%] h-full w-2 bg-white"></div>
</div>
</div>
<div class="bg-black border-2 border-glitch-dark-gray p-2 hover:border-glitch-red transition-colors relative">
<div class="flex items-center justify-between mb-2">
<span class="text-xs font-bold text-gray-400 uppercase font-mono">BIT_CRUSH</span>
</div>
<div class="relative w-full h-8 bg-glitch-dark-gray overflow-hidden">
<div class="absolute top-0 left-0 h-full w-[45%] bg-glitch-red opacity-80"></div>
<div class="absolute top-0 left-0 h-full w-full bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjMDAwIiBmaWxsLW9wYWNpdHk9IjAuMiIvPgo8L3N2Zz4=')]"></div>
<div class="absolute top-0 left-[45%] h-full w-4 bg-white border-x-2 border-black"></div>
</div>
</div>
</section>
<div class="absolute bottom-24 right-4 w-40 text-right">
<p class="font-mono text-[10px] text-glitch-red uppercase leading-tight">
                    Sys_Warning: Audio_Clip<br/>
                    Buffer_Overload<br/>
                    [0x00FF2A]
                </p>
</div>
</main>
<footer class="border-t-4 border-white bg-black p-4 z-40 relative">
<div class="absolute -top-4 left-4 bg-white px-2 py-0.5 text-black font-bold text-xs uppercase transform -skew-x-12">
                Transport_Control
            </div>
<div class="grid grid-cols-4 gap-2 h-16">
<button class="col-span-1 border-2 border-glitch-dark-gray hover:bg-glitch-red hover:text-black hover:border-glitch-red text-gray-500 transition-all active:translate-y-1 group">
<span class="material-symbols-outlined text-2xl group-hover:scale-110 block mb-1">stop_circle</span>
</button>
<button class="col-span-2 bg-glitch-green text-black border-2 border-transparent shadow-neon-green active:bg-white active:shadow-none active:translate-y-1 transition-all flex flex-col items-center justify-center relative overflow-hidden group">
<div class="absolute inset-0 bg-white opacity-0 group-hover:opacity-20 animate-pulse"></div>
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>

</div>

</div>
</footer>
</div>

</body></html>

<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Resonance Engine: Vapor Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "vapor-teal": "#2EFFFF",
                        "vapor-pink": "#FF71CE",
                        "vapor-lavender": "#B967FF",
                        "vapor-dark": "#121226", // Dark navy charcoal
                        "glass-surface": "rgba(30, 30, 60, 0.4)",
                        "glass-border": "rgba(255, 255, 255, 0.15)",
                        "glass-highlight": "rgba(255, 255, 255, 0.05)",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                    boxShadow: {
                        'glow-teal': '0 0 15px rgba(46, 255, 255, 0.6), 0 0 30px rgba(46, 255, 255, 0.3)',
                        'glow-pink': '0 0 15px rgba(255, 113, 206, 0.6), 0 0 30px rgba(255, 113, 206, 0.3)',
                        'glow-lavender': '0 0 15px rgba(185, 103, 255, 0.6), 0 0 30px rgba(185, 103, 255, 0.3)',
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.3)',
                        'arcade-button': '0 4px 0 #888, 0 5px 10px rgba(0,0,0,0.3)',
                        'arcade-button-pressed': '0 0 0 #888, inset 0 2px 5px rgba(0,0,0,0.3)',
                    },
                    backgroundImage: {
                        'vapor-grid': "linear-gradient(rgba(185, 103, 255, 0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(185, 103, 255, 0.2) 1px, transparent 1px)",
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #121226;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #2a2a4a 0%, #121226 60%);
        }.perspective-grid {
            position: fixed;
            bottom: 0;
            left: -50%;
            width: 200%;
            height: 50vh;
            background-image: 
                linear-gradient(transparent 0%, #121226 100%),
                linear-gradient(0deg, rgba(255, 113, 206, 0.2) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(46, 255, 255, 0.2) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            transform: perspective(300px) rotateX(60deg) translateY(100px) translateZ(-100px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }
        .radar-line {
            transform-origin: center;
            animation: radarSweep 2s linear infinite;
        }
        @keyframes radarSweep {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-pulse-beat {
            animation: pulseBeat 0.468s ease-in-out infinite; 
        }
        @keyframes pulseBeat {
            0% { transform: scale(1); opacity: 0.8; text-shadow: 0 0 5px currentColor; }
            50% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 20px currentColor; }
            100% { transform: scale(1); opacity: 0.8; text-shadow: 0 0 5px currentColor; }
        }.glass-panel {
            background: rgba(30, 30, 60, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen text-slate-100 relative selection:bg-vapor-pink selection:text-white">
<div class="perspective-grid"></div>
<div class="relative z-10 flex flex-col h-screen max-w-md mx-auto overflow-hidden border-x border-glass-border glass-panel">
<header class="flex items-center justify-between px-6 py-4 border-b border-glass-border bg-vapor-dark/40 backdrop-blur-md sticky top-0 z-20 shadow-lg">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-vapor-pink animate-pulse-beat" style="font-size: 32px; text-shadow: 0 0 10px #FF71CE;">equalizer</span>
<div>
<h1 class="text-xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-vapor-teal via-white to-vapor-pink drop-shadow-[0_0_5px_rgba(255,255,255,0.5)]">VAPOR</h1>
<div class="text-[9px] tracking-[0.3em] uppercase text-vapor-teal/80 font-semibold">Resonance</div>
</div>
</div>
<div class="flex flex-col items-center bg-black/20 px-3 py-1 rounded-lg border border-white/5 shadow-inner">
<div class="text-2xl font-bold text-vapor-teal animate-pulse-beat leading-none drop-shadow-[0_0_8px_rgba(46,255,255,0.8)]" style="font-family: 'Courier New', monospace;">128</div>
<div class="text-[9px] text-vapor-lavender font-bold tracking-widest uppercase mt-0.5">BPM</div>
</div>
<button class="p-2 rounded-full hover:bg-white/10 transition-colors text-vapor-lavender hover:text-white shadow-[0_0_10px_rgba(185,103,255,0.3)]">
<span class="material-symbols-outlined">settings_suggest</span>
</button>
</header>
<main class="flex-1 flex flex-col overflow-y-auto no-scrollbar pb-28">
<section class="relative flex-shrink-0 w-full aspect-square flex items-center justify-center p-4 my-2">
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-28 h-28 rounded-full border border-glass-border bg-gradient-to-br from-white/10 to-transparent backdrop-blur-md shadow-[0_0_30px_rgba(185,103,255,0.2)] flex items-center justify-center z-10">
<span class="material-symbols-outlined text-white/80 text-5xl drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]">album</span>
</div>
</div>
<div class="relative w-full h-full max-w-[360px] max-h-[360px]">
<svg class="w-full h-full transform -rotate-90 filter drop-shadow-[0_0_10px_rgba(46,255,255,0.15)]" viewBox="0 0 400 400">
<defs>
<filter height="200%" id="glow-teal-soft" width="200%" x="-50%" y="-50%">
<feGaussianBlur result="coloredBlur" stdDeviation="6"></feGaussianBlur>
<feMerge>
<feMergeNode in="coloredBlur"></feMergeNode>
<feMergeNode in="SourceGraphic"></feMergeNode>
</feMerge>
</filter>
<filter height="200%" id="glow-pink-soft" width="200%" x="-50%" y="-50%">
<feGaussianBlur result="coloredBlur" stdDeviation="6"></feGaussianBlur>
<feMerge>
<feMergeNode in="coloredBlur"></feMergeNode>
<feMergeNode in="SourceGraphic"></feMergeNode>
</feMerge>
</filter>
</defs>
<g class="track-synth cursor-pointer">
<circle cx="200" cy="200" fill="none" r="190" stroke="rgba(255,255,255,0.05)" stroke-width="24"></circle>
<path class="opacity-90" d="M 200 10 A 190 190 0 0 1 272.7 24.5" fill="none" filter="url(#glow-pink-soft)" stroke="#FF71CE" stroke-dasharray="0 20" stroke-linecap="round" stroke-width="16"></path>
<path class="opacity-50" d="M 200 10" fill="none" stroke="rgba(255,255,255,0.1)" stroke-dasharray="2 72.5" stroke-width="24"></path>
</g>
<g class="track-hat cursor-pointer">
<circle cx="200" cy="200" fill="none" r="155" stroke="rgba(255,255,255,0.05)" stroke-width="24"></circle>
<path class="opacity-90" d="M 200 45 A 155 155 0 0 1 259.3 56.8" fill="none" filter="url(#glow-pink-soft)" stroke="#B967FF" stroke-linecap="round" stroke-width="16"></path>
<path class="opacity-90" d="M 355 200 A 155 155 0 0 1 346.8 259.3" fill="none" filter="url(#glow-pink-soft)" stroke="#B967FF" stroke-linecap="round" stroke-width="16"></path>
<path class="opacity-50" d="M 200 45" fill="none" stroke="rgba(255,255,255,0.1)" stroke-dasharray="2 59" stroke-width="24"></path>
</g>
<g class="track-snare cursor-pointer">
<circle cx="200" cy="200" fill="none" r="120" stroke="rgba(255,255,255,0.05)" stroke-width="24"></circle>
<path d="M 320 200 A 120 120 0 0 1 200 320" fill="none" filter="url(#glow-teal-soft)" stroke="#2EFFFF" stroke-dasharray="0 100" stroke-linecap="round" stroke-width="16"></path>
<path class="opacity-50" d="M 200 80" fill="none" stroke="rgba(255,255,255,0.1)" stroke-dasharray="2 45" stroke-width="24"></path>
</g>
<g class="track-kick cursor-pointer">
<circle cx="200" cy="200" fill="none" r="85" stroke="rgba(255,255,255,0.05)" stroke-width="24"></circle>
<circle class="opacity-100" cx="200" cy="200" fill="none" filter="url(#glow-teal-soft)" r="85" stroke="#2EFFFF" stroke-dasharray="30 400" stroke-linecap="round" stroke-width="16"></circle>
<path class="opacity-50" d="M 200 115" fill="none" stroke="rgba(255,255,255,0.1)" stroke-dasharray="2 31" stroke-width="24"></path>
</g>
</svg>
<div class="absolute inset-0 pointer-events-none radar-line z-20">
<div class="w-full h-full relative">
<div class="absolute top-0 left-1/2 w-[3px] h-1/2 bg-gradient-to-b from-vapor-teal via-vapor-lavender to-transparent origin-bottom shadow-[0_0_15px_#2EFFFF] blur-[0.5px]"></div>
</div>
</div>
</div>
</section>
<section class="flex flex-col gap-8 px-6 mt-4">
<div class="grid grid-cols-3 gap-6">
<div class="flex flex-col items-center gap-3">
<div class="relative group cursor-pointer active:scale-95 transition-transform duration-100">
<div class="w-20 h-20 rounded-full bg-[#333] border-4 border-[#222] shadow-[0_5px_15px_rgba(0,0,0,0.5)] flex items-center justify-center relative overflow-hidden">
<div class="w-16 h-16 rounded-full bg-vapor-teal border-t-2 border-white/40 border-b-4 border-teal-700 shadow-[inset_0_0_10px_rgba(0,0,0,0.2)] flex items-center justify-center relative z-10 active:border-b-0 active:translate-y-1 active:brightness-90 transition-all">
<span class="material-symbols-outlined text-teal-900/70 drop-shadow-sm font-bold">tune</span>
</div>
<div class="absolute inset-0 bg-vapor-teal blur-xl opacity-20 group-hover:opacity-40 transition-opacity"></div>
</div>
</div>
<span class="text-[10px] font-bold text-vapor-teal tracking-widest uppercase drop-shadow-[0_0_5px_rgba(46,255,255,0.5)]">Pitch</span>
</div>
<div class="flex flex-col items-center gap-3">
<div class="relative group cursor-pointer active:scale-95 transition-transform duration-100">
<div class="w-20 h-20 rounded-full bg-[#333] border-4 border-[#222] shadow-[0_5px_15px_rgba(0,0,0,0.5)] flex items-center justify-center relative overflow-hidden">
<div class="w-16 h-16 rounded-full bg-vapor-pink border-t-2 border-white/40 border-b-4 border-pink-700 shadow-[inset_0_0_10px_rgba(0,0,0,0.2)] flex items-center justify-center relative z-10 active:border-b-0 active:translate-y-1 active:brightness-90 transition-all">
<span class="material-symbols-outlined text-pink-900/70 drop-shadow-sm font-bold">timelapse</span>
</div>
<div class="absolute inset-0 bg-vapor-pink blur-xl opacity-20 group-hover:opacity-40 transition-opacity"></div>
</div>
</div>
<span class="text-[10px] font-bold text-vapor-pink tracking-widest uppercase drop-shadow-[0_0_5px_rgba(255,113,206,0.5)]">Decay</span>
</div>
<div class="flex flex-col items-center gap-3">
<div class="relative group cursor-pointer active:scale-95 transition-transform duration-100">
<div class="w-20 h-20 rounded-full bg-[#333] border-4 border-[#222] shadow-[0_5px_15px_rgba(0,0,0,0.5)] flex items-center justify-center relative overflow-hidden">
<div class="w-16 h-16 rounded-full bg-vapor-lavender border-t-2 border-white/40 border-b-4 border-purple-800 shadow-[inset_0_0_10px_rgba(0,0,0,0.2)] flex items-center justify-center relative z-10 active:border-b-0 active:translate-y-1 active:brightness-90 transition-all">
<span class="material-symbols-outlined text-purple-900/70 drop-shadow-sm font-bold">blur_on</span>
</div>
<div class="absolute inset-0 bg-vapor-lavender blur-xl opacity-20 group-hover:opacity-40 transition-opacity"></div>
</div>
</div>
<span class="text-[10px] font-bold text-vapor-lavender tracking-widest uppercase drop-shadow-[0_0_5px_rgba(185,103,255,0.5)]">Reverb</span>
</div>
</div>
<div class="flex flex-col gap-6 glass-panel p-5 rounded-2xl border border-white/5 shadow-lg">
<div class="flex flex-col gap-3">
<div class="flex justify-between items-center text-xs font-bold text-white/80 tracking-widest uppercase font-mono">
<span class="drop-shadow-md">Bit Crush</span>
<span class="text-vapor-pink drop-shadow-[0_0_5px_rgba(255,113,206,0.8)]">45%</span>
</div>
<div class="relative h-6 w-full flex items-center">
<div class="absolute inset-0 h-1.5 my-auto bg-black/40 rounded-full shadow-inner overflow-hidden border border-white/5">
<div class="h-full bg-gradient-to-r from-vapor-lavender to-vapor-pink w-1/2 rounded-full shadow-[0_0_10px_#FF71CE]"></div>
</div>
<div class="absolute left-1/2 w-4 h-6 bg-white rounded shadow-[0_0_15px_rgba(255,255,255,0.6)] flex justify-center items-center cursor-ew-resize transform -translate-x-1/2 border border-vapor-pink">
<div class="w-[1px] h-3 bg-vapor-pink"></div>
</div>
</div>
</div>
<div class="flex flex-col gap-3">
<div class="flex justify-between items-center text-xs font-bold text-white/80 tracking-widest uppercase font-mono">
<span class="drop-shadow-md">Master Vol</span>
<span class="text-vapor-teal drop-shadow-[0_0_5px_rgba(46,255,255,0.8)]">80%</span>
</div>
<div class="relative h-6 w-full flex items-center">
<div class="absolute inset-0 h-1.5 my-auto bg-black/40 rounded-full shadow-inner overflow-hidden border border-white/5">
<div class="h-full bg-gradient-to-r from-vapor-lavender to-vapor-teal w-[80%] rounded-full shadow-[0_0_10px_#2EFFFF]"></div>
</div>
<div class="absolute left-[80%] w-4 h-6 bg-white rounded shadow-[0_0_15px_rgba(255,255,255,0.6)] flex justify-center items-center cursor-ew-resize transform -translate-x-1/2 border border-vapor-teal">
<div class="w-[1px] h-3 bg-vapor-teal"></div>
</div>
</div>
</div>
</div>
</section>
</main>
<footer class="absolute bottom-0 w-full px-6 py-6 bg-gradient-to-t from-vapor-dark via-vapor-dark/95 to-vapor-dark/80 backdrop-blur-xl border-t border-glass-border z-30">
<div class="flex items-center justify-between gap-5 max-w-sm mx-auto">
<button class="flex-1 group h-14 rounded-xl glass-panel hover:bg-white/10 active:scale-95 transition-all flex flex-col items-center justify-center border border-white/5 shadow-lg active:border-red-400/50">
<span class="material-symbols-outlined text-white/60 group-active:text-red-400 transition-colors drop-shadow-md" style="font-variation-settings: 'FILL' 1;">stop</span>
<span class="text-[9px] font-bold text-white/40 uppercase mt-1 tracking-widest">Stop</span>
</button>
<button class="flex-[1.4] group h-16 -mt-6 rounded-2xl bg-gradient-to-br from-vapor-lavender/20 to-vapor-teal/20 backdrop-blur-md border border-white/20 shadow-[0_0_20px_rgba(46,255,255,0.15)] active:scale-95 transition-all flex flex-col items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-white drop-shadow-[0_0_8px_#2EFFFF] transition-all" style="font-size: 38px; font-variation-settings: 'FILL' 1;">play_arrow</span>
<span class="text-[9px] font-bold text-vapor-teal uppercase mt-1 tracking-[0.2em] drop-shadow-sm">Play</span>
</button>
<button class="flex-1 group h-14 rounded-xl glass-panel hover:bg-white/10 active:scale-95 transition-all flex flex-col items-center justify-center border border-white/5 shadow-lg active:border-yellow-400/50">
<span class="material-symbols-outlined text-white/60 group-active:text-yellow-400 transition-colors drop-shadow-md">delete_outline</span>
<span class="text-[9px] font-bold text-white/40 uppercase mt-1 tracking-widest">Clear</span>
</button>
</div>
</footer>
</div>

</body></html>
